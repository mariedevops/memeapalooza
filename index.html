<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --r:#ff3f3f;--o:#ff8c00;--y:#ffe000;--g:#3dff6e;--b:#3db5ff;--p:#b94dff;--pk:#ff4db5;
  --dark:#0a0818;--border:rgba(255,255,255,0.12);
  --font-d:"Fredoka One",cursive;--font-b:"Nunito",sans-serif;
}
html,body{min-height:100%;background:var(--dark)}
body{
  font-family:var(--font-b);color:#fff;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(185,77,255,0.18) 0%,transparent 70%),
             radial-gradient(ellipse 60% 40% at 80% 90%,rgba(61,181,255,0.12) 0%,transparent 60%),
             var(--dark);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 48px;overflow-x:hidden;
}

/* ── ENTRY SCREEN ── */
#entryScreen{
  position:fixed;inset:0;z-index:500;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(185,77,255,0.25) 0%,transparent 70%),#0a0818;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
.entry-title{
  font-family:var(--font-d);font-size:clamp(32px,8vw,56px);
  letter-spacing:3px;text-align:center;line-height:1.1;margin-bottom:8px;
  filter:drop-shadow(0 0 24px rgba(255,224,0,0.35));
}
.entry-sub{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.35);margin-bottom:40px;text-align:center}
.entry-card{
  background:rgba(255,255,255,0.05);border:1.5px solid var(--border);
  border-radius:20px;padding:28px 28px 24px;width:100%;max-width:380px;
}
.entry-label{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:10px;display:block}
.entry-input{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--border);background:rgba(255,255,255,0.07);
  color:#fff;font-family:var(--font-b);font-weight:900;font-size:18px;
  outline:none;transition:border-color 0.2s;margin-bottom:8px;
}
.entry-input:focus{border-color:var(--y)}
.entry-hint{font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:20px}
.entry-btn{
  width:100%;padding:15px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#ff3f3f,#ff8c00);
  color:#fff;font-family:var(--font-d);font-size:20px;
  letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 24px rgba(255,100,0,0.4);
  transition:transform 0.12s,box-shadow 0.12s;
}
.entry-btn:hover{transform:scale(1.02);box-shadow:0 6px 32px rgba(255,100,0,0.55)}
.entry-btn:active{transform:scale(0.97)}
.entry-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.entry-status{font-size:13px;text-align:center;margin-top:12px;min-height:20px;color:var(--y)}

/* ── MAIN GAME ── */
#gameScreen{display:none;width:100%;flex-direction:column;align-items:center}

.game-title{
  font-family:var(--font-d);font-size:clamp(26px,6vw,46px);
  letter-spacing:3px;text-align:center;line-height:1.15;margin-bottom:4px;
  filter:drop-shadow(0 0 20px rgba(255,224,0,0.3));
}
.c1{color:var(--r)}.c2{color:var(--o)}.c3{color:var(--y)}
.c4{color:var(--g)}.c5{color:var(--b)}.c6{color:var(--p)}.c7{color:var(--pk)}
.game-subtitle{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.35);text-transform:uppercase;text-align:center;margin-bottom:16px}

/* player badge */
.player-badge{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:40px;padding:8px 20px;margin-bottom:18px;
}
.player-name{font-family:var(--font-d);font-size:15px;color:var(--b)}
.player-sep{color:rgba(255,255,255,0.2);font-size:12px}
.coins-label{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.4);text-transform:uppercase}
.coins-value{font-family:var(--font-d);font-size:20px;color:var(--y);min-width:60px;text-align:center;transition:transform 0.15s}
.coins-value.pop{transform:scale(1.3)}

/* layout: game + leaderboard side by side on wide screens */
.main-layout{
  display:flex;gap:16px;width:100%;max-width:860px;
  align-items:flex-start;flex-wrap:wrap;justify-content:center;
}

/* ── MACHINE ── */
.machine{
  flex:1;min-width:280px;max-width:460px;
  background:rgba(255,255,255,0.04);border:1.5px solid var(--border);
  border-radius:24px;padding:20px 20px 22px;position:relative;
}
.rainbow-stripe{display:flex;height:7px;border-radius:10px;overflow:hidden;margin-bottom:18px;gap:2px}
.rainbow-stripe span{flex:1;border-radius:4px}
.reels-outer{
  background:#0d0b1e;border:2px solid rgba(255,255,255,0.18);
  border-radius:14px;overflow:hidden;padding:4px;margin-bottom:16px;position:relative;
}
.reels-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.reel{
  background:#13102b;border-radius:10px;height:118px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.reel img{width:96px;height:96px;object-fit:cover;border-radius:8px;user-select:none;pointer-events:none}
.reel.spinning img{animation:reelBlur 0.07s steps(1) infinite}
@keyframes reelBlur{
  0%{transform:translateY(0) scale(1)}
  33%{transform:translateY(-8px) scale(0.93)}
  66%{transform:translateY(6px) scale(1.07)}
  100%{transform:translateY(0) scale(1)}
}
.reel.winning{animation:reelPop 0.35s ease-in-out 3}
@keyframes reelPop{
  0%,100%{background:#13102b}
  50%{background:#2a2010;box-shadow:inset 0 0 20px rgba(255,224,0,0.4)}
}
.win-line{
  position:absolute;top:50%;left:0;right:0;height:3px;
  background:var(--y);transform:translateY(-50%);border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:10;
  box-shadow:0 0 10px var(--y);
}
.win-line.show{opacity:1}

/* stonks meter */
.stonks-wrap{margin-bottom:16px}
.stonks-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.stonks-tag{font-family:var(--font-d);font-size:14px;color:var(--g);letter-spacing:2px}
.stonks-mult{font-family:var(--font-d);font-size:14px;color:var(--y)}
.stonks-track{height:16px;background:rgba(255,255,255,0.07);border-radius:20px;border:1px solid rgba(255,255,255,0.1);overflow:hidden}
.stonks-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#3dff6e,#ffe000,#ff8c00);transition:width 0.7s cubic-bezier(.34,1.56,.64,1);width:0%}
.stonks-arrows{display:flex;justify-content:center;gap:4px;margin-top:7px}
.stonks-arrow{font-size:16px;opacity:0.25;transition:opacity 0.3s,transform 0.3s}
.stonks-arrow.active{opacity:1;transform:translateY(-3px) scale(1.2)}

/* bet + spin */
.bet-section{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.bet-label{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.35);flex-shrink:0}
.bet-btn{
  flex:1;padding:7px 4px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);
  font-family:var(--font-b);font-weight:900;font-size:14px;cursor:pointer;
  transition:background 0.15s,border-color 0.15s,color 0.15s,transform 0.1s;
}
.bet-btn:hover{background:rgba(255,255,255,0.12)}
.bet-btn:active{transform:scale(0.96)}
.bet-btn.active{background:rgba(255,224,0,0.15);border-color:var(--y);color:var(--y)}
.spin-btn{
  width:100%;padding:17px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#ff3f3f 0%,#ff8c00 100%);
  color:#fff;font-family:var(--font-d);font-size:22px;letter-spacing:3px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.12s,opacity 0.2s;
  text-shadow:0 2px 6px rgba(0,0,0,0.4);box-shadow:0 4px 24px rgba(255,100,0,0.35);
}
.spin-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,transparent 60%);pointer-events:none}
.spin-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 6px 30px rgba(255,100,0,0.5)}
.spin-btn:active:not(:disabled){transform:scale(0.97)}
.spin-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none}
.result-msg{min-height:34px;text-align:center;margin-top:14px;font-family:var(--font-d);font-size:17px;letter-spacing:1px;line-height:1.3}

/* ── LEADERBOARD PANEL ── */
.lb-panel{
  flex:1;min-width:220px;max-width:340px;
  background:rgba(255,255,255,0.04);border:1.5px solid var(--border);
  border-radius:24px;padding:20px;
}
.lb-title{
  font-family:var(--font-d);font-size:16px;letter-spacing:2px;
  color:var(--y);text-align:center;margin-bottom:4px;
}
.lb-sub{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.3);text-align:center;text-transform:uppercase;margin-bottom:16px}
.lb-loading{text-align:center;color:rgba(255,255,255,0.3);font-size:13px;padding:20px 0}
.lb-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;margin-bottom:6px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
  transition:background 0.2s;
}
.lb-row.me{background:rgba(255,224,0,0.08);border-color:rgba(255,224,0,0.25)}
.lb-rank{
  font-family:var(--font-d);font-size:14px;min-width:24px;text-align:center;
}
.lb-rank.gold{color:#ffd700}.lb-rank.silver{color:#c0c0c0}.lb-rank.bronze{color:#cd7f32}
.lb-rank.other{color:rgba(255,255,255,0.35)}
.lb-name{flex:1;font-size:13px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name.me{color:var(--y)}
.lb-coins{font-family:var(--font-d);font-size:14px;color:var(--g)}
.lb-spins{font-size:11px;color:rgba(255,255,255,0.3);text-align:right}
.lb-refresh{
  width:100%;margin-top:12px;padding:8px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.5);font-family:var(--font-b);font-weight:700;
  font-size:12px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;
  transition:background 0.15s;
}
.lb-refresh:hover{background:rgba(255,255,255,0.1)}

/* ── PAYTABLE ── */
.paytable{width:100%;max-width:860px;margin-top:22px}
.paytable-title{text-align:center;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:12px}
.paytable-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.paytable-row{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:12px;padding:9px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.paytable-thumb{width:38px;height:38px;object-fit:cover;border-radius:6px;flex-shrink:0}
.paytable-val{font-family:var(--font-d);font-size:13px;color:var(--y);text-align:right}
.paytable-desc{font-size:10px;color:rgba(255,255,255,0.35);text-align:right}

/* ── STONKS POPUP ── */
.stonks-popup{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
  z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.stonks-popup.show{display:flex}
.stonks-popup img{width:min(360px,90vw);border-radius:16px;animation:popIn 0.4s cubic-bezier(.34,1.56,.64,1)}
.stonks-popup .close-btn{
  font-family:var(--font-d);font-size:18px;color:#fff;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  border-radius:40px;padding:8px 28px;cursor:pointer;letter-spacing:2px;
}
@keyframes popIn{0%{transform:scale(0.5) rotate(-5deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes jackpotGlow{
  0%,100%{box-shadow:0 0 0 rgba(255,224,0,0)}
  50%{box-shadow:0 0 60px rgba(255,224,0,0.5),0 0 120px rgba(255,100,0,0.3)}
}
.machine.jackpot{animation:jackpotGlow 0.5s ease-in-out 4}
.coin-burst{position:fixed;pointer-events:none;font-size:22px;animation:burst 0.9s ease-out forwards;z-index:999}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0.3);opacity:0}}

/* sync indicator */
.sync-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--g);margin-left:6px;vertical-align:middle;
  animation:syncPulse 2s ease-in-out infinite;
}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.7)}}
</style>
</head>
<body>

<!-- ENTRY SCREEN -->
<div id="entryScreen">
  <div class="entry-title">
    <span class="c1">M</span><span class="c2">E</span><span class="c3">M</span><span class="c4">E</span><span class="c5">-</span><span class="c6">A</span><span class="c7">-</span><br>
    <span class="c1">P</span><span class="c2">A</span><span class="c3">L</span><span class="c4">O</span><span class="c5">O</span><span class="c6">Z</span><span class="c7">A</span>
  </div>
  <div class="entry-sub">Virtual Coins Only · No Real Money</div>
  <div class="entry-card">
    <label class="entry-label" for="usernameInput">Your username</label>
    <input class="entry-input" id="usernameInput" type="text" placeholder="e.g. DogeKing99" maxlength="20" autocomplete="off" spellcheck="false">
    <div class="entry-hint">2–20 characters · letters, numbers, underscores only</div>
    <button class="entry-btn" id="entryBtn" onclick="startGame()">LET'S GOOO 🎰</button>
    <div class="entry-status" id="entryStatus"></div>
  </div>
</div>

const SYMBOLS = ["doge","disaster","dealwith","pikachu"];
const WEIGHTS  = [1,2,3,4];
const PAYOUTS  = {doge:10,disaster:8,dealwith:6,pikachu:4};
const NAMES    = {doge:"Doge Jackpot!",disaster:"Disaster Girl",dealwith:"Deal With It",pikachu:"Surprised Pikachu"};

let coins=1000, bet=10, stonks=0, isSpinning=false;
let username="", totalSpins=0, biggestWin=0;

// ── SUPABASE HELPERS ──
async function sbFetch(path, method="GET", body=null) {
  const opts = {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer "+SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": method==="POST" ? "resolution=merge-duplicates,return=representation" : "return=representation"
    }
  };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL+"/rest/v1/"+path, opts);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadOrCreatePlayer(name) {
  // Try to load existing player
  const rows = await sbFetch(`leaderboard?username=eq.${encodeURIComponent(name)}&select=*`);
  if(rows.length > 0) {
    const p = rows[0];
    coins = p.coins;
    totalSpins = p.spins;
    biggestWin = p.biggest_win;
    return "welcome_back";
  } else {
    // Create new player
    await sbFetch("leaderboard", "POST", {
      username: name, coins: 1000, spins: 0, biggest_win: 0
    });
    coins = 1000; totalSpins = 0; biggestWin = 0;
    return "new";
  }
}

async function savePlayer() {
  setSyncDot(true);
  try {
    await sbFetch("leaderboard", "POST", {
      username, coins, spins: totalSpins, biggest_win: biggestWin,
      updated_at: new Date().toISOString()
    });
  } catch(e) { console.warn("Save failed:", e); }
  setSyncDot(false);
}

async function loadLeaderboard() {
  const el = document.getElementById("lbContent");
  try {
    const rows = await sbFetch("leaderboard?select=username,coins,spins&order=coins.desc&limit=10");
    if(!rows.length) { el.innerHTML = '<div class="lb-loading">No players yet!</div>'; return; }
    el.innerHTML = rows.map((r,i) => {
      const rankClass = i===0?"gold":i===1?"silver":i===2?"bronze":"other";
      const rankIcon  = i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`;
      const isMe = r.username.toLowerCase()===username.toLowerCase();
      return `<div class="lb-row ${isMe?"me":""}">
        <span class="lb-rank ${rankClass}">${rankIcon}</span>
        <div style="flex:1;min-width:0">
          <div class="lb-name ${isMe?"me":""}">${r.username}${isMe?" 👈":""}</div>
          <div class="lb-spins">${r.spins} spins</div>
        </div>
        <div>
          <div class="lb-coins">${r.coins.toLocaleString()}</div>
          <div class="lb-spins">🪙</div>
        </div>
      </div>`;
    }).join("");
  } catch(e) {
    el.innerHTML = '<div class="lb-loading">Could not load 😢</div>';
  }
}

function setSyncDot(on) {
  document.getElementById("syncDot").style.background = on ? "#ff8c00" : "#3dff6e";
}

// ── ENTRY ──
document.getElementById("usernameInput").addEventListener("keydown", e => {
  if(e.key==="Enter") startGame();
});

async function startGame() {
  const raw = document.getElementById("usernameInput").value.trim();
  if(!/^[a-zA-Z0-9_]{2,20}$/.test(raw)) {
    document.getElementById("entryStatus").textContent = "⚠️ 2–20 chars, letters/numbers/underscores only";
    document.getElementById("entryStatus").style.color = "#ff6644";
    return;
  }
  username = raw;
  const btn = document.getElementById("entryBtn");
  btn.disabled = true;
  document.getElementById("entryStatus").style.color = "var(--y)";
  document.getElementById("entryStatus").textContent = "Connecting to leaderboard...";
  try {
    const result = await loadOrCreatePlayer(username);
    document.getElementById("entryStatus").textContent = result==="welcome_back"
      ? `Welcome back, ${username}! 🎉 (${coins} coins loaded)`
      : `New player created! Starting with 1000 coins 🚀`;
    setTimeout(showGame, 800);
  } catch(e) {
    document.getElementById("entryStatus").textContent = "⚠️ DB error — playing offline";
    document.getElementById("entryStatus").style.color = "#ff8844";
    setTimeout(showGame, 1000);
  }
}

function showGame() {
  document.getElementById("entryScreen").style.display = "none";
  const gs = document.getElementById("gameScreen");
  gs.style.display = "flex";
  document.getElementById("playerNameDisplay").textContent = username;
  updateCoins();
  updateStonks();
  ["s0","s1","s2"].forEach((id,i) => document.getElementById(id).src = IMGS[SYMBOLS[i%SYMBOLS.length]]);
  buildPaytable();
  loadLeaderboard();
  setInterval(loadLeaderboard, 30000); // auto-refresh every 30s
}

function buildPaytable() {
  const pg = document.getElementById("paytableGrid");
  SYMBOLS.forEach(sym => {
    pg.innerHTML += `<div class="paytable-row">
      <img class="paytable-thumb" src="${IMGS[sym]}" alt="${sym}">
      <div><div class="paytable-val">×${PAYOUTS[sym]}</div><div class="paytable-desc">${NAMES[sym]}</div></div>
    </div>`;
  });
  pg.innerHTML += `
    <div class="paytable-row"><span style="font-size:20px">🤝🤝</span><div><div class="paytable-val">×1.5</div><div class="paytable-desc">Any 2 match</div></div></div>
    <div class="paytable-row"><span style="font-size:20px">📈</span><div><div class="paytable-val">×3 bonus</div><div class="paytable-desc">STONKS at 100%</div></div></div>`;
}

// ── GAME LOGIC ──
function weightedRandom() {
  const total=WEIGHTS.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<SYMBOLS.length;i++){r-=WEIGHTS[i];if(r<=0)return SYMBOLS[i];}
  return SYMBOLS[SYMBOLS.length-1];
}
function setBet(v) {
  bet=v;
  document.querySelectorAll(".bet-btn").forEach(b=>b.classList.toggle("active",parseInt(b.dataset.bet)===v));
}
function updateCoins(delta) {
  const el=document.getElementById("coinDisplay");
  el.textContent=coins;
  if(delta){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),200);}
}
function updateStonks() {
  const pct=Math.min(stonks,100);
  document.getElementById("stonksFill").style.width=pct+"%";
  const mult=pct>=100?3:pct>=60?2:1;
  document.getElementById("multDisplay").textContent=mult+"× multiplier";
  for(let i=0;i<5;i++) document.getElementById("arr"+i).classList.toggle("active",pct>=(i+1)*20);
}
function setResult(msg,color) {
  const el=document.getElementById("resultMsg");
  el.textContent=msg;el.style.color=color||"#fff";
}
function burstCoins(x,y,count) {
  for(let i=0;i<count;i++) {
    const el=document.createElement("div");el.className="coin-burst";el.textContent="🪙";
    el.style.left=x+"px";el.style.top=y+"px";
    el.style.setProperty("--tx",(Math.random()*220-110)+"px");
    el.style.setProperty("--ty",(Math.random()*-200-40)+"px");
    el.style.animationDelay=(Math.random()*0.2)+"s";
    document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
  }
}

function spin() {
  if(isSpinning)return;
  if(coins<bet){setResult("😢 Not enough coins!","#ff6644");return;}
  isSpinning=true;coins-=bet;totalSpins++;updateCoins(-bet);
  document.getElementById("spinBtn").disabled=true;
  document.getElementById("winLine").classList.remove("show");
  document.getElementById("machine").classList.remove("jackpot");
  setResult("");
  ["r0","r1","r2"].forEach(id=>document.getElementById(id).classList.add("spinning"));
  const results=[weightedRandom(),weightedRandom(),weightedRandom()];
  const stops=[650,1000,1350];
  ["r0","r1","r2"].forEach((id,i)=>{
    setTimeout(()=>{
      document.getElementById(id).classList.remove("spinning");
      document.getElementById("s"+i).src=IMGS[results[i]];
      if(i===2)finalize(results);
    },stops[i]);
  });
}

function finalize(results) {
  const currentMult=stonks>=100?3:stonks>=60?2:1;
  let payMult=0,msg="",msgColor="#fff",winIdxs=[],isJackpot=false;

  if(results[0]===results[1]&&results[1]===results[2]) {
    payMult=PAYOUTS[results[0]];winIdxs=[0,1,2];
    if(results[0]==="doge"){msg="🚀 DOGE JACKPOT!! SUCH WIN! VERY COINS!";msgColor="#ffe000";isJackpot=true;}
    else{msg="🎉 THREE OF A KIND! "+NAMES[results[0]]+"!";msgColor="#3dff6e";}
    stonks=Math.min(100,stonks+30);
  } else if(results[0]===results[1]){payMult=1.5;winIdxs=[0,1];msg="✅ Two match!";msgColor="#88ffaa";stonks=Math.min(100,stonks+10);}
  else if(results[1]===results[2]){payMult=1.5;winIdxs=[1,2];msg="✅ Two match!";msgColor="#88ffaa";stonks=Math.min(100,stonks+10);}
  else if(results[0]===results[2]){payMult=1.5;winIdxs=[0,2];msg="✅ Bookends!";msgColor="#88ffaa";stonks=Math.min(100,stonks+10);}
  else{msg="Surprised Pikachu... no win.";msgColor="#ff8844";stonks=Math.max(0,stonks-5);}

  if(payMult>0) {
    const boosted=stonks>=100;
    const finalMult=payMult*(boosted?currentMult:1);
    const won=Math.round(bet*finalMult);
    coins+=won;biggestWin=Math.max(biggestWin,won);
    updateCoins(won);
    msg+=boosted&&payMult>1?` ×${currentMult} STONKS = +${won}!`:` +${won} coins!`;
    winIdxs.forEach(i=>{const r=document.getElementById("r"+i);r.classList.remove("winning");void r.offsetWidth;r.classList.add("winning");});
    if(winIdxs.length===3)document.getElementById("winLine").classList.add("show");
    if(isJackpot){
      document.getElementById("machine").classList.add("jackpot");
      const btn=document.getElementById("spinBtn");
      const rect=btn.getBoundingClientRect();
      burstCoins(rect.left+rect.width/2,rect.top,18);
    }
    if(boosted&&payMult>1){
      stonks=0;
      setTimeout(()=>document.getElementById("stonksPopup").classList.add("show"),600);
    }
  }

  if(coins<=0){coins=500;updateCoins(0);setTimeout(()=>setResult("💸 Broke! +500 bonus coins!","#ff8c00"),700);}

  updateStonks();setResult(msg,msgColor);
  // Save after every spin (debounced via setTimeout to avoid hammering)
  setTimeout(savePlayer, 300);
  setTimeout(()=>{isSpinning=false;document.getElementById("spinBtn").disabled=false;},500);
}
</script>
